<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Cart | Parisa Art</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="site-header">

        <a
            href="index.html"
            class="logo"
        >
            PARISA ART
        </a>


        <nav class="main-nav">

            <a href="index.html">
                HOME
            </a>

            <a href="woman.html">
                WOMAN
            </a>

            <a href="nature.html">
                NATURE
            </a>

            <a href="ocean.html">
                OCEAN
            </a>

            <a href="ink.html">
                INK
            </a>

        </nav>

    </header>


    <main class="cart-page">

        <h1>
            Your Cart
        </h1>


        <div
            id="cart-items"
        >
        </div>


        <div
            class="empty-cart"
            id="empty-cart"
        >
            Your cart is empty.
        </div>


        <div
            class="cart-summary"
            id="cart-summary"
        >

            <div class="cart-summary-row">

                <span>
                    Total
                </span>

                <span id="cart-total">
                    €0.00
                </span>

            </div>


            <button
                class="checkout-button"
                id="checkout-button"
            >
                Proceed to Checkout
            </button>

        </div>

    </main>


    <footer>

        <div class="footer-logo">
            PARISA ART
        </div>

        <p>
            Original paintings by Parisa
        </p>

        <p>
            © 2026 Parisa Art. All Rights Reserved.
        </p>

    </footer>


    <script src="cart.js"></script>

</body>

</html>
